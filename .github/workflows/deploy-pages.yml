# Builds the app with the /LifeAssistant/ base path and publishes it to
# GitHub Pages on every push to main.
#
# Pages rather than Netlify because netlify.app is blocked on the household's
# connection — measured, along with pages.dev and fly.dev; github.io,
# vercel.app and onrender.com answered. That is a property of the shared
# apex, not of the host, so if github.io is ever blocked too the durable
# answer is a custom domain (Pages serves one for free) rather than another
# free subdomain.
#
# Repository secrets it needs: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# VITE_OMDB_KEY. VITE_TMDB_TOKEN is optional — without it the richer film
# metadata is simply absent, which the app already handles.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /LifeAssistant/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # every VITE_ var the code reads is inlined at build time, so one
          # missing here is a feature that fails silently in production —
          # film search was exactly that until this line
          VITE_OMDB_KEY: ${{ secrets.VITE_OMDB_KEY }}
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}
      # SPA fallback: Pages serves 404.html for unknown paths, so deep links
      # like /LifeAssistant/budget keep working on refresh
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
